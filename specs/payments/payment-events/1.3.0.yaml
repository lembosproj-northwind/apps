asyncapi: 3.0.0
info:
  title: Payment Events
  version: 1.3.0
  description: >-
    Payment outcomes as a stream, for anything that must not call back into payments. Consuming this
    keeps a service out of PCI scope; calling the Payments API does not.
servers:
  kafka:
    host: kafka.northwind.example:9093
    protocol: kafka-secure
channels:
  paymentSettled:
    address: northwind.payments.payment-settled
    messages:
      PaymentSettled:
        $ref: '#/components/messages/PaymentSettled'
  paymentFailed:
    address: northwind.payments.payment-failed
    messages:
      PaymentFailed:
        $ref: '#/components/messages/PaymentFailed'
operations:
  receivePaymentSettled:
    action: receive
    channel:
      $ref: '#/channels/paymentSettled'
  receivePaymentFailed:
    action: receive
    channel:
      $ref: '#/channels/paymentFailed'
components:
  messages:
    PaymentSettled:
      name: PaymentSettled
      contentType: application/json
      payload:
        type: object
        required: [orderId, authorizationId, amount, currency, settledAt]
        properties:
          orderId: { type: string, format: uuid }
          authorizationId: { type: string }
          amount: { type: string }
          currency: { type: string }
          settledAt: { type: string, format: date-time }
          last4:
            type: string
            description: The only card data on this stream, and the only one permitted on it.
    PaymentFailed:
      name: PaymentFailed
      contentType: application/json
      payload:
        type: object
        required: [orderId, reason, failedAt]
        properties:
          orderId: { type: string, format: uuid }
          reason: { type: string, enum: [declined, expired, insufficient-funds, fraud-suspected] }
          failedAt: { type: string, format: date-time }
