name: publish

# Tags and manual runs only.
#
# Not on every push to main: the working loop for this fixture is `aspire run` against a local
# registry, where an image is built and pulled without leaving the machine. Publishing here is for
# the two cases that loop does not cover — somebody running the fixture without building it, and
# exercising provenance and digest pinning across a real network boundary.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: Northwind.WebService
            image: web-service
          - project: Northwind.Worker
            image: worker
          - project: Northwind.CronJob
            image: cron-job
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      # The digest is the point of this step. A BlueprintVersion pins a digest, and a deployment
      # records the one it resolved — so the digest this emits is what makes the seeded artifact
      # coordinates resolvable instead of synthesised.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: echo "${{ matrix.image }} -> ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # A custom-runtime Lambda ships as a zip whose entry point is `bootstrap`, which is what the
      # serverless-function module's default handler expects.
      - run: |
          dotnet publish src/Northwind.Function -c Release -r linux-x64 --self-contained false -o out
          cd out && zip -r ../function.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: function
          path: function.zip

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No build step: the archetype is a pre-built bundle, and `identity.json` is rewritten by the
      # deployment rather than by CI — CI does not know which environment it is going to.
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: src/Northwind.StaticSite/
